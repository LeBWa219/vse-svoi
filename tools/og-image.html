<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0b0718;
    font-family: Inter, system-ui, sans-serif;
    color: #fff;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); }
  .o1 { width: 480px; height: 480px; top: -140px; left: -120px; background: rgba(91,33,182,0.55); }
  .o2 { width: 420px; height: 420px; bottom: -160px; right: -100px; background: rgba(37,99,235,0.45); }
  .o3 { width: 300px; height: 300px; top: 180px; right: 260px; background: rgba(220,20,60,0.25); }
  .frame {
    position: absolute; inset: 24px;
    border: 1px solid rgba(167,139,250,0.35);
    border-radius: 24px;
  }
  .content {
    position: relative; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; padding: 0 90px;
  }
  .wordmark {
    font-family: 'Unbounded', sans-serif; font-weight: 700;
    font-size: 92px; line-height: 1.05; letter-spacing: 1px;
    background: linear-gradient(100deg, #a78bfa 0%, #60a5fa 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 8px;
    font-size: 20px; font-weight: 600; letter-spacing: 6px;
    text-transform: uppercase; color: rgba(196,181,253,0.9);
  }
  .tagline {
    margin-top: 34px;
    font-size: 38px; font-weight: 600; line-height: 1.3; color: #f1f5f9;
    max-width: 900px;
  }
  .tagline b { color: #a78bfa; }
  .chips { display: flex; gap: 14px; margin-top: 36px; }
  .chip {
    padding: 12px 26px; border-radius: 999px;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.4);
    font-size: 22px; font-weight: 600; color: #e2e8f0;
  }
  .domain {
    position: absolute; right: 90px; bottom: 54px;
    font-size: 22px; font-weight: 600; color: rgba(226,232,240,0.75);
  }
</style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="frame"></div>
  <div class="content">
    <div>
      <div class="wordmark">ВСЕ СВОИ</div>
      <div class="sub">аутсорсинг персонала</div>
    </div>
    <div class="tagline">Персонал для бизнеса и <b>работа курьером</b> — по всей России</div>
    <div class="chips">
      <div class="chip">Вакансии от Яндекса</div>
      <div class="chip">Выплаты 2 раза в неделю</div>
      <div class="chip">Гибкий график</div>
    </div>
  </div>
  <div class="domain">vse-svoi · вся Россия</div>
</body>
</html>
